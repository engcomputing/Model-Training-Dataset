<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Rush — Car Racing</title>
<style>
:root{color-scheme:dark;--yellow:#ffd43b;--panel:#172033}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at top,#263653,#0b1020 70%);color:#f7f8fc;font-family:system-ui,sans-serif}.game{width:min(100%,460px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.tag{color:var(--yellow);font-size:.75rem;font-weight:800;letter-spacing:.12em}h1{margin:0;font-size:clamp(1.35rem,5vw,2rem)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:var(--panel);border:1px solid #ffffff16;border-radius:12px;padding:9px;text-align:center}.stat span{display:block;color:#aab6cc;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.stat strong{font-size:1.2rem}.stage{position:relative;overflow:hidden;border:2px solid #ffffff22;border-radius:16px;background:#287c46;box-shadow:0 20px 55px #0008}canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#07101dcc}.overlay.hidden{display:none}.dialog{max-width:300px}.dialog h2{margin:0 0 8px;font-size:2rem}.dialog p{color:#d4dced;line-height:1.5;margin:0 0 18px}button{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--yellow);color:#171b25;box-shadow:0 4px 0 #b58d00}button:active{transform:translateY(2px);box-shadow:0 2px 0 #b58d00}.help{display:flex;justify-content:space-between;gap:10px;color:#b8c3d7;font-size:.8rem;margin:12px 2px}.touch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.touch button{padding:14px;font-size:1.05rem;background:#24314b;color:white;box-shadow:0 4px 0 #111827;border:1px solid #ffffff22;touch-action:manipulation}.touch button.active{background:#405579;transform:translateY(2px)}@media(min-width:700px){.touch{opacity:.8}}
</style>
</head>
<body><main class="game">
<header><div><div class="tag">ARCADE MODE</div><h1>ROAD RUSH</h1></div><button id="restartTop">Restart ↻</button></header>
<section class="stats"><div class="stat"><span>Score</span><strong id="score">0</strong></div><div class="stat"><span>Speed</span><strong id="speed">1x</strong></div><div class="stat"><span>Best</span><strong id="best">0</strong></div></section>
<div class="stage"><canvas id="game" width="360" height="480" aria-label="Car racing game"></canvas><div class="overlay" id="overlay"><div class="dialog"><h2 id="overlayTitle">Ready to race?</h2><p id="overlayText">Dodge traffic, stay on the road, and beat your best score.</p><button id="startBtn">Start racing</button></div></div></div>
<div class="help"><span>Keyboard: ← → or A / D</span><span>Pass cars to score</span></div><div class="touch"><button id="leftBtn">◀ LEFT</button><button id="rightBtn">RIGHT ▶</button></div>
</main>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),W=360,H=480,road={x:42,width:276},lanes=[88,150,212,274];const $=id=>document.getElementById(id);let player,traffic,score,speed,frame,running=false,lastTime=0,spawnTimer=0,keys={left:false,right:false};let best=0;try{best=Number(localStorage.getItem('roadRushBest')||0)}catch{}$('best').textContent=best;
function rr(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function car(x,y,w,h,color,hero=false){rr(x+2,y+4,w,h,7,'#07101b66');rr(x,y,w,h,7,color);rr(x+5,y+8,w-10,13,4,hero?'#bdeaff':'#c6d5e8');rr(x+5,y+h-20,w-10,10,3,hero?'#17354c':'#303b4c');ctx.fillStyle='#171b25';ctx.fillRect(x-3,y+9,4,11);ctx.fillRect(x+w-1,y+9,4,11);ctx.fillRect(x-3,y+h-20,4,11);ctx.fillRect(x+w-1,y+h-20,4,11);ctx.fillStyle=hero?'#fff1a8':'#ff5d68';ctx.fillRect(x+4,y+2,6,3);ctx.fillRect(x+w-10,y+2,6,3)}
function roadDraw(){ctx.fillStyle='#287c46';ctx.fillRect(0,0,W,H);ctx.fillStyle='#318c50';for(let y=-40+(frame*speed/90)%40;y<H;y+=40){ctx.fillRect(8,y,20,12);ctx.fillRect(W-28,y+18,20,12)}ctx.fillStyle='#555b66';ctx.fillRect(road.x,0,road.width,H);ctx.fillStyle='#e9e7d6';ctx.fillRect(road.x,0,5,H);ctx.fillRect(road.x+road.width-5,0,5,H);ctx.fillStyle='#ffffffb8';let off=(frame*speed/75)%56;for(let y=-56+off;y<H;y+=56){ctx.fillRect(road.x+69,y,4,30);ctx.fillRect(road.x+138,y,4,30);ctx.fillRect(road.x+207,y,4,30)}}
function spawn(){let lane=Math.floor(Math.random()*4),colors=['#ef5350','#ffb020','#9b7bff','#38bdf8','#f1f5f9'];traffic.push({x:lanes[lane]-15,y:-60,w:30,h:48,color:colors[Math.floor(Math.random()*colors.length)],passed:false})}
function hit(a,b){let p=5;return a.x+p<b.x+b.w-p&&a.x+a.w-p>b.x+p&&a.y+p<b.y+b.h-p&&a.y+a.h-p>b.y+p}
function end(){running=false;let n=Math.floor(score);if(n>best){best=n;try{localStorage.setItem('roadRushBest',String(best))}catch{}$('best').textContent=best}$('overlayTitle').textContent='Race over!';$('overlayText').textContent='You scored '+n+'. Try again and beat your best!';$('startBtn').textContent='Race again';$('overlay').classList.remove('hidden')}
function loop(t){if(!running)return;let dt=Math.min((t-(lastTime||t))/1000,.035);lastTime=t;frame+=dt*60;speed=Math.min(150+score*1.8,330);score+=dt*10;$('score').textContent=Math.floor(score);$('speed').textContent=(speed/150).toFixed(1)+'x';roadDraw();if(keys.left)player.x-=player.move*dt;if(keys.right)player.x+=player.move*dt;player.x=Math.max(road.x+8,Math.min(road.x+road.width-player.w-8,player.x));spawnTimer+=dt;if(spawnTimer>Math.max(.48,1.05-score/180)){spawn();spawnTimer=0}for(let i=traffic.length-1;i>=0;i--){let c=traffic[i];c.y+=speed*dt;if(hit(player,c)){car(c.x,c.y,c.w,c.h,c.color);car(player.x,player.y,player.w,player.h,'#18b8f3',true);end();return}if(!c.passed&&c.y>player.y+player.h){c.passed=true;score+=15}if(c.y>H+60)traffic.splice(i,1)}traffic.forEach(c=>car(c.x,c.y,c.w,c.h,c.color));car(player.x,player.y,player.w,player.h,'#18b8f3',true);requestAnimationFrame(loop)}
function start(){player={x:W/2-16,y:H-90,w:32,h:52,move:250};traffic=[];score=0;speed=150;frame=0;spawnTimer=0;lastTime=0;running=true;$('score').textContent='0';$('speed').textContent='1x';$('overlay').classList.add('hidden');requestAnimationFrame(loop)}
function key(k,d){if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=d;if(k==='ArrowRight'||k==='d'||k==='D')keys.right=d}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D',' '].includes(e.key))e.preventDefault();key(e.key,true);if((e.key===' '||e.key==='Enter')&&!running)start()});window.addEventListener('keyup',e=>key(e.key,false));window.addEventListener('blur',()=>keys={left:false,right:false});
function bind(id,k){let el=$(id),down=e=>{e.preventDefault();keys[k]=true;el.classList.add('active')},up=e=>{e.preventDefault();keys[k]=false;el.classList.remove('active')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}
bind('leftBtn','left');bind('rightBtn','right');$('startBtn').addEventListener('click',start);$('restartTop').addEventListener('click',start);player={x:W/2-16,y:H-90,w:32,h:52,move:250};traffic=[];frame=0;speed=150;roadDraw();car(player.x,player.y,player.w,player.h,'#18b8f3',true)
})();
</script></body></html>
